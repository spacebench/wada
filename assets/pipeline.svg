<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline: data flows into a model, then to a decision, with a feedback loop">
  <!-- Example figure for the seed deck (deck.html, slide 4). -->

  <!-- THEME COPY — kujaku (styles/themes/kujaku.css). Swap to re-theme. -->
  <style>
    .bg-base          { fill: #F5F7F7; }
    .bg-surface       { fill: #FFFFFF; }
    .bg-muted         { fill: #E3EBEB; }
    .bg-inverse       { fill: #123B3F; }
    .text-primary     { fill: #17323A; }
    .text-secondary   { fill: #51707A; }
    .text-inverse     { fill: #F2F7F6; }
    .text-on-accent   { fill: #FFFFFF; }
    .accent-primary   { fill: #0E7C7B; }
    .accent-secondary { fill: #7A5195; }
    .accent-tertiary  { fill: #C2A14D; }
    .accent-inverse   { fill: #C2A14D; }
    .stroke-primary   { stroke: #0E7C7B; }
    .stroke-secondary { stroke: #7A5195; }
    .stroke-tertiary  { stroke: #C2A14D; }
    .stroke-strong    { stroke: #17323A; }
    .stroke-subtle    { stroke: #D3DFDF; }
  </style>

  <rect class="bg-surface" width="800" height="480"/>

  <rect class="accent-primary" x="70" y="180" width="180" height="110" rx="8"/>
  <rect class="accent-secondary" x="320" y="180" width="180" height="110" rx="8"/>
  <rect class="bg-inverse" x="570" y="180" width="180" height="110" rx="8"/>

  <line class="stroke-strong" x1="250" y1="235" x2="320" y2="235" stroke-width="2" fill="none"/>
  <polygon class="text-primary" points="320,235 306,228 306,242"/>
  <line class="stroke-strong" x1="500" y1="235" x2="570" y2="235" stroke-width="2" fill="none"/>
  <polygon class="text-primary" points="570,235 556,228 556,242"/>

  <text x="160" y="242" text-anchor="middle" font-family="sans-serif" font-size="20" class="text-on-accent">data</text>
  <text x="410" y="242" text-anchor="middle" font-family="sans-serif" font-size="20" class="text-on-accent">model</text>
  <text x="660" y="242" text-anchor="middle" font-family="sans-serif" font-size="20" class="text-inverse">decision</text>

  <circle class="accent-tertiary" cx="410" cy="120" r="14"/>
  <text x="410" y="95" text-anchor="middle" font-family="sans-serif" font-size="14" class="text-primary">feedback</text>
  <path class="stroke-tertiary" d="M 660 180 Q 660 90 424 106" fill="none" stroke-width="2" stroke-dasharray="5 5"/>
</svg>
