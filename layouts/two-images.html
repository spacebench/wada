<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout: two-images</title>
<!--
  LAYOUT: two-images
  WHEN: two figures compared side by side under one shared heading —
        before/after, two variants, two examples.
  SLOTS: kicker, h2 (shared across both columns); two .col blocks, each a
         .figure with an optional .caption below it.
  LIMITS: keep captions to one short line; figures roughly the same aspect.
  FIGURES: the .figure-ph div is a placeholder — replace it with
           <img src="../assets/<figure>.svg"> (see AGENTS.md §6).
-->
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/themes/kujaku.css">
</head>
<body>

<section class="slide layout-two-images">
  <div class="slide-content">
    <p class="kicker">Section Name</p>
    <h2>Two versions, side by side</h2>
    <div class="cols">
      <div class="col">
        <figure class="figure figure-contain">
          <div class="figure-ph">figure · assets/&lt;name&gt;.svg</div>
        </figure>
        <p class="caption">Caption for the left figure</p>
      </div>
      <div class="col">
        <figure class="figure figure-contain">
          <div class="figure-ph">figure · assets/&lt;name&gt;.svg</div>
        </figure>
        <p class="caption">Caption for the right figure</p>
      </div>
    </div>
  </div>
  <footer class="slide-footer">
    <span>Deck Title</span>
    <span>7</span>
  </footer>
</section>

</body>
</html>
