<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout: section-divider</title>
<!--
  LAYOUT: section-divider
  WHEN: between major parts of the deck; resets the audience's attention.
  SLOTS: .section-num (e.g. "01"), h2 (section title, <= 6 words),
         optional .lead (what this section covers).
  NOTES: inverse variant works well here: class="slide layout-section inverse".
-->
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/themes/kujaku.css">
</head>
<body>

<section class="slide layout-section">
  <p class="section-num">01</p>
  <h2>Section Title</h2>
  <p class="lead">Optional one-liner describing what this section covers.</p>
</section>

</body>
</html>
