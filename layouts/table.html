<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout: table</title>
<!--
  LAYOUT: table
  WHEN: structured data the audience must compare row by row.
  SLOTS: kicker, h2; <table> with thead/tbody; optional .caption (source).
  LIMITS: max 6 rows × 5 columns. Numbers in <td class="num"> right-align
          and use the mono font. If it does not fit, it is not a table
          slide — split it or make it a chart.
-->
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/themes/kujaku.css">
</head>
<body>

<section class="slide layout-table">
  <p class="kicker">Results</p>
  <h2>Model comparison</h2>
  <table>
    <thead>
      <tr>
        <th>Model</th>
        <th>Approach</th>
        <th>Precision</th>
        <th>Recall</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Baseline</td>
        <td>Docking score</td>
        <td class="num">0.61</td>
        <td class="num">0.58</td>
      </tr>
      <tr>
        <td>Model B</td>
        <td>Graph neural net</td>
        <td class="num">0.74</td>
        <td class="num">0.71</td>
      </tr>
      <tr>
        <td><strong>Ours</strong></td>
        <td><strong>Foundation model + docking</strong></td>
        <td class="num"><strong>0.87</strong></td>
        <td class="num"><strong>0.83</strong></td>
      </tr>
    </tbody>
  </table>
  <p class="caption">Source: internal benchmark, n = 12,000 compounds.</p>
</section>

</body>
</html>
