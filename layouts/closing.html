<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout: closing</title>
<!--
  LAYOUT: closing
  WHEN: final slide — thank you, call to action, contact.
  SLOTS: h2 (short closer, e.g. "Thank you" or the ask), optional .lead,
         .contact blocks (label in <strong> + value).
  LIMITS: max 3 contact blocks. This slide stays up during Q&A — keep the
          most important info on it.
  NOTES: inverse variant makes a strong final frame.
-->
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/themes/kujaku.css">
</head>
<body>

<section class="slide layout-closing">
  <p class="kicker">Thank you</p>
  <h2>Questions &amp; discussion</h2>
  <p class="lead">Optional call to action or one-line summary of the ask.</p>
  <div class="contact">
    <div>
      <strong>Email</strong>
      name@example.org
    </div>
    <div>
      <strong>Lab / Team</strong>
      Team name, institution
    </div>
    <div>
      <strong>Code / Data</strong>
      github.com/org/repo
    </div>
  </div>
</section>

</body>
</html>
