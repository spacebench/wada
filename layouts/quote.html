<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout: quote</title>
<!--
  LAYOUT: quote
  WHEN: a citation, user testimonial, or guiding principle worth pausing on.
  SLOTS: blockquote text, .attribution (name in <strong> + role/source).
  LIMITS: quote <= 35 words. One quote per slide.
  NOTES: inverse variant works well.
-->
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/themes/kujaku.css">
</head>
<body>

<section class="slide layout-quote">
  <blockquote>
    The best model is the one whose mistakes you can still explain.
  </blockquote>
  <p class="attribution"><strong>Person Name</strong> · Role, Organization</p>
</section>

</body>
</html>
