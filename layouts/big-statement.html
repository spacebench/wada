<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout: big-statement</title>
<!--
  LAYOUT: big-statement
  WHEN: the single most important sentence of the deck; a pivot point;
        a bold claim. Use once or twice per deck, not more.
  SLOTS: optional kicker, one <p> statement with <em> on the key phrase.
  LIMITS: statement <= 20 words. Nothing else on the slide.
  NOTES: inverse variant is strong here.
-->
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/themes/kujaku.css">
</head>
<body>

<section class="slide layout-statement">
  <p class="kicker">Key message</p>
  <p>The one sentence the audience must <em>remember</em> tomorrow.</p>
</section>

</body>
</html>
