<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout: cover</title>
<!--
  LAYOUT: cover
  WHEN: slide 1 of the deck. Exactly one per deck.
  SLOTS: kicker (context/event), h1 (deck title, <= 8 words),
         .lead (one-line subtitle), .meta (author/date left, venue right).
  NOTES: add class "inverse" to the section for a dark cover.
-->
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/themes/kujaku.css">
</head>
<body>

<section class="slide layout-cover">
  <p class="kicker">Conference / Team Meeting · 2026</p>
  <h1>Deck Title Goes Here</h1>
  <p class="lead">One-line subtitle that frames the story of the deck.</p>
  <div class="meta">
    <span>Author Name · Affiliation</span>
    <span>Date</span>
  </div>
</section>

</body>
</html>
